<title>Scene Designer — Moses</title>
<!--
  SCENE DIRECTOR NOTES — Moses (Exodus 1–40; Numbers; Deuteronomy 34)
  10 scenes. Descriptions follow the biblical account and give
  staging direction for the scene designer: setting, characters, key props,
  light and mood. Reference board for iconic biblical compositions: the
  "famous bible scenes" ideas board on Pinterest.

  1. The Child in the River
     The mother hides the child for three months, then sets him in a basket of bulrushes among the reeds, where Pharaoh's daughter finds him. Stage: a river bank at dawn, tall reeds, a floating basket, a woman and her sister watching from the distance; mist on the water, a child's cry.

  2. The Burning Bush
     Moses keeps the flock of Jethro in the wilderness of Horeb, and the angel of the Lord appears in a flame of fire out of the bush. Stage: a desert slope at noon, a shepherd's staff, a bush burning without burning up; the light of the flame on a man's face, sandals coming off.

  3. Before the Throne
     Moses stands before Pharaoh, and the plagues come: water to blood, frogs, gnats, flies, and the rest, until the firstborn cry out. Stage: a throne room with gold and lapis, a staff on the floor, a river turning red, the city in darkness; the court hardening, scene by scene.

  4. Passover Night
     The people eat the lamb in haste, with loins girded, and the blood marks the doorposts; the destroyer passes over. Stage: a night house with a meal of lamb and unleavened bread, a door marked with a bunch of hyssop; a family waiting, a city holding its breath.

  5. Through the Sea
     The pillar of cloud goes behind, the sea is divided, and the people cross on dry ground; the waters return over the chariots. Stage: a sea with walls of water, a people walking on the seabed at night, the cloud lighting the way, the horses and the chariots drowned in the morning; a world of water held back.

  6. Bread in the Wilderness
     The Lord gives manna in the morning and quails in the evening; the people gather only enough for the day. Stage: a wilderness camp at dawn, a white ground like frost, small round things lying all around, a jar of manna kept for the testimony; a people learning to trust the day.

  7. Sinai
     The Lord comes down on Mount Sinai in fire, the mountain smokes, and the people stand at the foot, hearing the voice of the trumpet. Stage: a mountain wrapped in smoke and fire, the people at its foot, the covenant being spoken; thunder, lightning, a trumpet's long call.

  8. The Golden Calf
     The people make a molten calf and worship it, and Moses breaks the tablets at the foot of the mountain. Stage: a camp of gold and fire, a calf of gold, a man running down the mountain, two tablets of stone in his hands; the silence after the shattering.

  9. Forty Years
     The people wander in the wilderness, and the Lord sends manna, water from the rock, and the bronze serpent to save. Stage: a desert of tents and wandering, a rock giving water, a serpent of bronze on a pole, a generation passing and a new one rising; the long road to the border.

  10. Mount Nebo
     Moses goes up to Mount Nebo and sees the whole land, and the Lord buries him in the valley; a prophet without equal in Israel. Stage: a mountain at sunset, a man looking over the land of promise, the light on the far hills; the last view, a grave no one knows, the road ending.
  -->

.stage{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;background:rgba(13,13,18,.92);border-bottom:1px solid var(--border)}.scene-name{font-weight:800}.scene-meta{font-size:.75rem;color:var(--dim)}
.preview-wrap{display:flex;align-items:center;justify-content:center;padding:24px;min-height:0}.preview{position:relative;width:min(100%,1200px);aspect-ratio:16/9;background:#111;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}.preview svg{position:absolute;inset:0;width:100%;height:100%;display:block}.preview .fg{pointer-events:none}
.layerbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 18px;background:var(--panel);border-top:1px solid var(--border);font-size:.78rem;color:var(--dim)}.layerbar label{display:flex;align-items:center;gap:6px}.filename{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto;min-height:100vh;overflow:visible}.sidebar{border-right:0;border-bottom:1px solid var(--border)}.stage{min-height:70vh}.preview-wrap{padding:12px}.filename{width:100%;margin-left:0}}

function detectEnvironment(){
  const act=(Number($("chapter").value)||0)+1;
  if(storyKey==="Adam")return ["mountain","garden","garden","garden","garden","garden"][act-1]||"garden";
  if(storyKey==="Abraham")return ["city","palace","river","desert","desert","desert","interior","desert","interior","mountain"][act-1]||"desert";

  if(storyKey==="David")return ["garden","mountain","palace","garden","mountain","desert","city","city","interior","garden","desert","city"][act-1]||"garden";
  if(storyKey==="Deborah")return ["garden","garden","mountain","river","garden","interior","river"][act-1]||"garden";
  if(storyKey==="Elijah")return ["river","interior","interior","mountain","sea","desert","mountain"][act-1]||"mountain";
  if(storyKey==="Elisha")return ["garden","river","interior","interior","garden","river","river","mountain","interior"][act-1]||"garden";
  if(storyKey==="Enoch")return ["interior","garden","interior","garden","city","garden","mountain"][act-1]||"garden";
  if(storyKey==="Esther")return ["palace","palace","city","palace","palace","interior","palace","palace","city","city"][act-1]||"palace";
  if(storyKey==="Gideon")return ["garden","garden","garden","river","desert","desert","river"][act-1]||"garden";
  if(storyKey==="Hannah")return ["mountain","interior","interior","interior","garden","interior","interior","interior"][act-1]||"interior";
  if(storyKey==="Isaiah")return ["city","interior","garden","city","desert","interior","desert","desert","city"][act-1]||"city";
  if(storyKey==="Moses")return ["river", "desert", "palace", "interior", "sea", "desert", "river", "camp", "mountain", "camp", "mountain", "desert", "desert", "camp", "mountain"][act-1]||"desert";
  const s=sceneText();
  if(/sea|ship|storm|deep|flood|\bark\b|water opened|through the sea/.test(s)) return "sea";
  if(/river|jordan|well|brook|water|reeds|cistern/.test(s)) return "river";
  if(/palace|king|throne|temple|shiloh|banquet|court|furnace|prison|house|room|table/.test(s)) return "palace";

  if(/mount|mountain|sinai|nebo|carmel|rock|cave|whirlwind/.test(s)) return "mountain";
  if(/garden|field|flock|grain|vineyard|tree|palm|glean|shepherd|land|harvest/.test(s)) return "garden";
  if(/dream|vision|stars|night|voice|angel|beast|writing/.test(s)) return "night";
  if(/desert|wilderness|journey|road|haran|moab|exile|wandering|drought/.test(s)) return "desert";
  if(/tent|meal|robe|scroll|potter|oil|bread/.test(s)) return "interior";
  return "desert";
}

function rocks(rand,s,scale){let o="";for(const side of [0,1])for(let i=0;i<4;i++){const x=side?(1570+i*100):(40+i*100),w=(90+rand()*150)*scale,h=(70+rand()*160)*scale;o+=`<path d="M${x} 1080 l${w*.15} -${h*.65} l${w*.42} -${h*.35} l${w*.43} ${h*.45} l${w*.18} ${h*.55}Z" fill="${mix(s.near,"#746b61",.36)}" stroke="${s.ink}" stroke-width="10" opacity=".95"/>`}return o}

function manifest(){return JSON.stringify({story:displayStory(storyKey),act:last.act,chapter:last.chapter.title,brief:last.chapter.director||last.chapter.brief,scene:{id:last.beat.id,name:last.beat.name},canvas:{width:1920,height:1080},environment:last.settings.env,time:last.settings.tod,seed:last.settings.seed,materials:last.chapter.materialFiles||last.chapter.materials||[],artBoard:last.chapter.artFolder||null,layers:{background:`${last.base}_background.svg`,middleGround:`${last.base}_middle_ground.svg`,foreground:`${last.base}_foreground.svg`},foregroundDetails:{plants:last.settings.fgPlants,rocks:last.settings.fgRocks,structures:last.settings.fgStructures,props:last.settings.fgProps,framing:last.settings.fgFraming},layering:["background","middle-ground/optional character staging","foreground"]},null,2)}

function makeZip(files){
  const encoder=new TextEncoder(),locals=[],central=[];let offset=0;

async function downloadAllScenes(){
  const button=$("downloadAll"),status=$("exportStatus"),chapterValue=$("chapter").value,beatValue=$("beat").value;
  button.disabled=true;status.textContent="Preparing scenes…";
  try{
    const files=[];
    for(let chapter=0;chapter<chapters.length;chapter++){
      $("chapter").value=chapter;resetPalette();
      for(const beat of beats){
        $("beat").value=beat.id;render();
        const folder=`assets/svg/${last.chapter.assetFolder||`act_${String(last.act).padStart(2,"0")}_${slug(last.chapter.title)}`}/${last.beat.id.toLowerCase()}_${slug(last.beat.name)}`;
        files.push({name:`${folder}/${last.base}_background.svg`,text:last.bg});
        files.push({name:`${folder}/${last.base}_middle_ground.svg`,text:last.mid});
        files.push({name:`${folder}/${last.base}_foreground.svg`,text:last.fg});
        files.push({name:`${folder}/${last.base}_scene.json`,text:manifest()});
      }
      status.textContent=`Prepared act ${chapter+1} of ${chapters.length}…`;
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    const index={story:displayStory(storyKey),exportedAt:new Date().toISOString(),acts:chapters.length,beatsPerAct:beats.length,sceneCount:chapters.length*beats.length,fileCount:files.length,canvas:{width:1920,height:1080},layers:["background","middle-ground","foreground"],assetsRoot:"assets/svg/"};
    files.unshift({name:"scene-export.json",text:JSON.stringify(index,null,2)});
    const blob=makeZip(files),name=`${slug(displayStory(storyKey))}_all_scenes.zip`,a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    status.textContent=`Exported ${index.sceneCount} scenes (${files.length} files).`;
  }catch(error){console.error(error);status.textContent="Bulk export failed. Please try again."}
  finally{$("chapter").value=chapterValue;$("beat").value=beatValue;resetPalette();render();button.disabled=false}
}
async function downloadCurrentActScenes(){
  const button=$("downloadAct"),status=$("exportStatus"),chapterValue=$("chapter").value,beatValue=$("beat").value;
  const chapter=Number(chapterValue)||0,act=chapters[chapter];
  button.disabled=true;status.textContent="Preparing this act’s three stages…";
  try{
    const files=[],folderRoot=`assets/svg/${act.assetFolder||`act_${String(chapter+1).padStart(2,"0")}_${slug(act.title)}`}`;
    for(const beat of beats){
      $("beat").value=beat.id;render();
      const folder=`${folderRoot}/${beat.id.toLowerCase()}_${slug(beat.name)}`;
      files.push({name:`${folder}/${last.base}_background.svg`,text:last.bg});
      files.push({name:`${folder}/${last.base}_middle_ground.svg`,text:last.mid});
      files.push({name:`${folder}/${last.base}_foreground.svg`,text:last.fg});
      files.push({name:`${folder}/${last.base}_scene.json`,text:manifest()});
    }
    const index={story:displayStory(storyKey),act:chapter+1,title:act.title,exportedAt:new Date().toISOString(),stages:beats.map(b=>b.name),canvas:{width:1920,height:1080},layers:["background","middle-ground","foreground"],assetsRoot:"assets/svg/"};
    files.unshift({name:`${folderRoot}/scene-export.json`,text:JSON.stringify(index,null,2)});
    const blob=makeZip(files),name=`${slug(displayStory(storyKey))}_act${chapter+1}_scenes.zip`,a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    status.textContent=`Exported all three stages for Act ${chapter+1} (${files.length} files).`;
  }catch(error){console.error(error);status.textContent="Act export failed. Please try again."}
  finally{$("chapter").value=chapterValue;$("beat").value=beatValue;resetPalette();render();button.disabled=false}
}
function colorField(id,label,value){return `<label class="color">${label}<input id="${id}" type="color" value="${value}"></label>`}

function displayStory(s){return s==="Eiljah"?"Elijah":s}

function xml(s){return escapeHtml(s)}

$("downloadMid").onclick=()=>download(last.mid,`${last.base}_middle_ground.svg`);
$("downloadFg").onclick=()=>download(last.fg,`${last.base}_foreground.svg`);
$("downloadManifest").onclick=()=>download(manifest(),`${last.base}_scene.json`,"application/json");
$("downloadAll").onclick=downloadAllScenes;

resetPalette(); render();
if(window.__SCENE_FORGE_CAPTURE__) window.__SCENE_FORGE_CAPTURE__.api={chapters,beats,exportCurrent(chapter,beat){$("chapter").value=String(chapter);$("beat").value=beat;resetPalette();render();return {...last}}};
})();
